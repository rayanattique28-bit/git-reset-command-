<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Cool HTML Program</title>

    <style>
        body{
            margin:0;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#0f172a,#1e293b,#334155);
            font-family:Arial, sans-serif;
            overflow:hidden;
        }

        .box{
            background:rgba(255,255,255,0.1);
            padding:40px;
            border-radius:20px;
            text-align:center;
            color:white;
            backdrop-filter:blur(10px);
            box-shadow:0 0 20px rgba(0,0,0,0.4);
            animation:float 3s ease-in-out infinite;
        }

        h1{
            font-size:45px;
            margin-bottom:10px;
        }

        p{
            font-size:18px;
            opacity:0.9;
        }

        button{
            margin-top:20px;
            padding:12px 25px;
            border:none;
            border-radius:10px;
            background:#38bdf8;
            color:white;
            font-size:18px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#0ea5e9;
            transform:scale(1.1);
        }

        @keyframes float{
            0%{transform:translateY(0);}
            50%{transform:translateY(-10px);}
            100%{transform:translateY(0);}
        }
    </style>
</head>

<body>

    <div class="box">
        <h1 id="title">Welcome!</h1>
        <p>Click the button to change the message.</p>

        <button onclick="changeText()">Click Me</button>
    </div>

    <script>
        function changeText(){
            const messages = [
                "You are awesome 😎",
                "HTML + CSS + JS 🚀",
                "VS Code is working perfectly ✅",
                "Keep learning programming 💻",
                "Future Developer 🔥"
            ];

            let random =
                messages[Math.floor(Math.random() * messages.length)];

            document.getElementById("title").innerText = random;
        }
    </script>

</body>
</html>
